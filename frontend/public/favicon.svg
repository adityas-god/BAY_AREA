<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Roof Gradient: GreyOrange Vibrant Energy -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFAE2C"/>
      <stop offset="100%" stop-color="#FF5500"/>
    </linearGradient>

    <!-- Left Wall: Pure Architectural Pristine White -->
    <linearGradient id="facadeLeftWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAEFF7"/>
    </linearGradient>

    <!-- Right Wall: Architectural Shaded White (Cool Silver Gray) -->
    <linearGradient id="facadeRightWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D5DCEB"/>
      <stop offset="100%" stop-color="#B8C1D6"/>
    </linearGradient>

    <!-- Glowing Active Bay Portal -->
    <linearGradient id="bayPortal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#FFBF42"/>
    </linearGradient>
  </defs>

  <!-- Soft Ground Contact Shadow (Provides grounding on both light & dark tabs) -->
  <polygon points="10,42 32,53 54,42 44,48 20,48" fill="#000000" opacity="0.15"/>

  <!-- Ground Coordinate Bracket (Signature Bay Area Accent) -->
  <polyline points="6,39 6,46 18,52.5" fill="none" stroke="#FF8C00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="6" cy="39" r="1.6" fill="#FF8C00"/>

  <!-- ISOMETRIC BUILDING STRUCTURE (WHITE WALLS, TRANSPARENT BG) -->

  <!-- Left Wall (Front-Left: Illuminated Pristine White) -->
  <polygon points="10,22 32,33 32,53 10,42" fill="url(#facadeLeftWhite)" stroke="#A6B0C4" stroke-width="0.8"/>

  <!-- Right Wall (Front-Right: Shaded White / Cool Silver Slate) -->
  <polygon points="32,33 54,22 54,42 32,53" fill="url(#facadeRightWhite)" stroke="#8F9AB2" stroke-width="0.8"/>

  <!-- Top Roof Facet -->
  <polygon points="32,11 54,22 32,33 10,22" fill="url(#roofGrad)" stroke="#FF7700" stroke-width="0.8"/>

  <!-- Architectural Roof Atrium / Skylight Inset -->
  <polygon points="32,15.5 45.5,22 32,29 18.5,22" fill="#141822"/>
  <polygon points="32,17.5 42,22 32,27.5 22,22" fill="none" stroke="#FF8C00" stroke-width="1.2" opacity="0.9"/>

  <!-- Active Robotics Bay Portal / Entrance (Left White Wall) -->
  <polygon points="17,39.5 24.5,43.25 24.5,50 17,46.25" fill="url(#bayPortal)"/>
  <!-- Bay Interior Cutout Shadow -->
  <polygon points="19,41.5 23.5,43.75 23.5,48.75 19,46.5" fill="#160D04"/>

  <!-- Architectural Ribbon Windows (Right Wall: Dark Glass Slits) -->
  <line x1="37" y1="34" x2="49" y2="28" stroke="#FF8C00" stroke-width="1.4" stroke-linecap="round" opacity="0.9"/>
  <line x1="37" y1="39" x2="49" y2="33" stroke="#222836" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>
  <line x1="37" y1="44" x2="49" y2="38" stroke="#222836" stroke-width="1.3" stroke-linecap="round" opacity="0.75"/>

  <!-- Central Corner Ridge Edge -->
  <line x1="32" y1="33" x2="32" y2="53" stroke="#8A95AB" stroke-width="1.2" stroke-linecap="round"/>
</svg>
