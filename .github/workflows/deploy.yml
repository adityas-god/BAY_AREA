name: Deploy to Production VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Container Stack
    runs-on: self-hosted
    steps:
      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory '*' || true

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Frontend on Host VM
        working-directory: ./frontend
        run: |
          echo "Building frontend on host machine..."
          npm install
          npm run build
          rm -f .output/public/favicon.ico || true
          cp -f public/favicon.svg .output/public/favicon.svg 2>/dev/null || true
          if [ ! -f .output/public/index.html ]; then
            if [ -f .output/public/_shell.html ]; then
              cp .output/public/_shell.html .output/public/index.html
            fi
          fi
          echo "Public directory contents:"
          ls -la .output/public/

      - name: Deploy Docker Stack
        run: |
          echo "Deploying BAY_AREA container stack..."
          if docker compose version >/dev/null 2>&1; then
            docker compose down || true
            docker compose up -d --build --force-recreate
          else
            docker-compose down || true
            docker-compose up -d --build --force-recreate
          fi
          echo "Waiting 5 seconds for container startup..."
          sleep 5
          docker ps --filter "name=bay-area-frontend"
