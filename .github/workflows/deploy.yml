name: Deploy to Production VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Container Stack
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js on Host VM
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend on Host VM
        working-directory: ./frontend
        run: |
          echo "Building frontend on host machine..."
          npm ci || npm install
          npm run build

      - name: Deploy Docker Stack
        run: |
          echo "Deploying BAY_AREA container stack..."
          docker compose down || true
          docker compose up -d --build
          echo "Waiting 5 seconds for container startup..."
          sleep 5
          docker ps --filter "name=bay-area-frontend"
