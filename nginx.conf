server {
    listen 80;
    server_name localhost;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html index.htm _shell.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html /_shell.html =404;
    }

    # Direct all favicon requests to our GreyOrange vector SVG with cache bust
    location = /favicon.ico {
        return 301 /favicon.svg?v=5;
    }

    # Disable caching for favicon and html so changes reflect immediately
    location ~* \.(ico|svg)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri =404;
    }

    location ~* (index|_shell)\.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    error_page 404 /index.html;
}
