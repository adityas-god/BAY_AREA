services:
  bay-area-frontend:
    image: bay-area-frontend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bay-area-frontend
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_ENV=production
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8083/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
